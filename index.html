<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учет работы агрегатов v23</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: #f8fafc; 
            color: #1e293b; 
            padding-bottom: 40px; 
        }
        
        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background-color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        header { 
            background-color: #ffffff; 
            padding: 16px; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        
        .header-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .header-top h1 { 
            font-size: 19px; 
            font-weight: 700;
            color: #1e3a8a;
            letter-spacing: -0.3px;
        }
        
        .clear-btn { 
            font-size: 12px; 
            font-weight: 600;
            padding: 6px 14px; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            background: #ffffff; 
            color: #475569; 
            cursor: pointer; 
        }
        
        .tabs { 
            display: flex; 
            justify-content: space-around; 
            margin-top: 16px; 
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
        }
        
        .tab-btn { 
            flex: 1;
            font-size: 13px; 
            text-transform: uppercase; 
            font-weight: 700; 
            background: none; 
            border: none; 
            color: #64748b; 
            padding: 9px 0;
            border-radius: 8px;
            cursor: pointer; 
        }
        
        .tab-btn.active { 
            background: #ffffff;
            color: #1e3a8a;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        main { 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        .tab-content { 
            display: none; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        .tab-content.active { 
            display: flex; 
        }
        
        .card { 
            background-color: #ffffff; 
            border: 1px solid #e2e8f0; 
            padding: 18px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        
        .flex-row-justify { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .block-title { 
            font-size: 14px; 
            font-weight: 700; 
        }
        
        .title-blue { color: #1e3a8a; } 
        .title-rose { color: #b91c1c; } 
        .title-green { color: #15803d; } 
        
        .sub-card { 
            background-color: #f8fafc; 
            border: 1px solid #e2e8f0; 
            padding: 12px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 8px;
        }
        
        .time-container-inputs {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box span {
            font-size: 9px;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .time-input { 
            width: 46px; 
            height: 40px;
            text-align: center; 
            background: #f1f5f9; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px;
            color: #0f172a; 
            font-weight: 700; 
            font-size: 16px; 
            outline: none; 
            transition: all 0.15s;
        }
        
        .time-input:focus {
            border-color: #1e3a8a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .time-divider {
            font-weight: 700;
            font-size: 18px;
            color: #94a3b8;
            margin-top: 10px;
            padding: 0 2px;
        }
        
        select, input[type="text"] { 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            background: #f1f5f9; 
            color: #0f172a; 
            font-size: 16px; 
            font-weight: 600;
            outline: none; 
        }

        select:focus, input[type="text"]:focus {
            border-color: #1e3a8a;
            background: #ffffff;
        }
        
        .select-w-60 { 
            width: 58%; 
            color: #1e3a8a;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%231e3a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            padding-right: 28px;
            appearance: none;
            font-size: 14px;
        }
        
        .add-btn { 
            color: #ffffff; 
            background-color: #1e3a8a;
            font-size: 12px; 
            padding: 8px 14px; 
            border-radius: 8px; 
            border: none; 
            font-weight: 700; 
            cursor: pointer; 
        }
        
        .calc-btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            background-color: #1e3a8a; 
            color: #ffffff; 
            font-weight: 700; 
            font-size: 16px; 
            border: none; 
            cursor: pointer; 
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
        }
        
        .del-btn { 
            background: #fef2f2; 
            border: 1px solid #fca5a5; 
            color: #ef4444; 
            width: 34px;
            height: 40px;
            border-radius: 8px;
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
        }
        
        .results-card { 
            border: 1px solid #1e3a8a; 
            padding: 18px; 
            border-radius: 16px; 
            display: none; 
            flex-direction: column; 
            gap: 14px; 
            background-color: #ffffff;
        }
        
        .results-card.active { display: flex; }
        
        .res-item { 
            border-top: 1px solid #e2e8f0; 
            padding-top: 14px; 
            margin-top: 4px; 
        }
        
        .res-item:first-child { border-top: none; padding-top: 0; margin-top: 0; }
        .res-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; color: #0f172a; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .res-sub { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; background-color: #f8fafc; color: #475569; }
        .res-val { font-weight: 700; font-size: 14px; display: block; margin-top: 4px; color: #1e3a8a; }
        .res-val-green { color: #16a34a; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-top">
            <h1>Учет работы агрегатов</h1>
            <button class="clear-btn" onclick="resetDay()">Очистить</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-calc" onclick="switchTab('calc')">Сутки</button>
            <button class="tab-btn" id="tab-variants" onclick="switchTab('variants')">Варианты</button>
            <button class="tab-btn" id="tab-equipment" onclick="switchTab('equipment')">Техника</button>
        </div>
    </header>

    <main>
        <div id="content-calc" class="tab-content active">
            <div class="card flex-row-justify" style="padding: 14px 18px;">
                <span style="font-size: 13px; font-weight: 800; color: #475569;">НАЧАЛО СУТОК:</span>
                <div class="time-container-inputs">
                    <div class="time-box">
                        <input type="text" inputmode="decimal" pattern="[0-9]*" id="dayStartH" class="time-input" value="04" maxlength="2" oninput="handleStaticTimeInput(this)">
                    </div>
                    <div class="time-divider" style="margin-top:0;">:</div>
                    <div class="time-box">
                        <input type="text" inputmode="decimal" pattern="[0-9]*" id="dayStartM" class="time-input" value="00" maxlength="2" oninput="handleStaticTimeInput(this)" onblur="validateStaticTime(this, 59)">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="block-title title-blue">1. График вариантов по части суток</div>
                <div id="shifts-container" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>

            <div class="card">
                <div class="flex-row-justify">
                    <div class="block-title title-rose">2. Простой (Ремонт / Не работал)</div>
                    <button class="add-btn" onclick="addDynamicRow('downtime')">+ Добавить</button>
                </div>
                <div id="downtime-container" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>

            <div class="card">
                <div class="flex-row-justify">
                    <div class="block-title title-green">3. Включения по готовности</div>
                    <button class="add-btn" onclick="addDynamicRow('readiness')">+ Добавить</button>
                </div>
                <div id="readiness-container" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>

            <button class="calc-btn" onclick="calculateDay()">Рассчитать сутки</button>

            <div id="resultsCard" class="results-card">
                <h3 style="font-size:15px; font-weight:800; border-bottom:1px solid #e2e8f0; padding-bottom:8px; color: #1e3a8a;">Результаты расчета:</h3>
                <div id="results-list" style="display:flex; flex-direction:column; gap:12px;"></div>
            </div>
        </div>

        <div id="content-variants" class="tab-content">
            <div style="font-size: 14px; font-weight: 700; color: #475569; padding-left: 4px;">Настройка состава вариантов</div>
            <div id="variants-container" style="display:flex; flex-direction:column; gap:14px;"></div>
        </div>

        <div id="content-equipment" class="tab-content">
            <div style="font-size: 14px; font-weight: 700; color: #475569; padding-left: 4px;">Список агрегатов</div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="newEqName" placeholder="Введите название агрегата..." style="flex-grow:1; background:#ffffff;">
                <button class="calc-btn" style="width:54px; padding:0; border-radius:10px;" onclick="addNewEquipment()">+</button>
            </div>
            <div class="card" id="equipment-list" style="padding:6px; gap:0;"></div>
        </div>
    </main>
</div>

<script>
    let state = {
        currentTab: 'calc', dayStartH: '04', dayStartM: '00',
        equipment: [
            { id: 1, name: 'Агрегат А-1' }, { id: 2, name: 'Компрессор К-2' }, { id: 3, name: 'Насос Н-1' }
        ],
        variants: [
            { id: 1, name: 'Вариант А', eqIds: [1, 2] }, { id: 2, name: 'Вариант Б', eqIds: [1, 3] },
            { id: 3, name: 'Вариант В', eqIds: [2] }, { id: 4, name: 'Вариант Г', eqIds: [3] }
        ],
        shifts: [
            { start: '04:00', end: '06:00', variantId: null }, { start: '06:00', end: '12:00', variantId: null },
            { start: '12:00', end: '16:00', variantId: null }, { start: '16:00', end: '22:00', variantId: null },
            { start: '22:00', end: '04:00', variantId: null }
        ],
        downtimes: [], readiness: []
    };

    window.onload = function() {
        if(localStorage.getItem('app_state_v23')) {
            try { state = JSON.parse(localStorage.getItem('app_state_v23')); } catch(e){}
        }
        state.currentTab = 'calc';
        document.getElementById('dayStartH').value = state.dayStartH || '04';
        document.getElementById('dayStartM').value = state.dayStartM || '00';
        renderAll();
    };

    function saveState() {
        state.dayStartH = document.getElementById('dayStartH').value || '00';
        state.dayStartM = document.getElementById('dayStartM').value || '00';
        localStorage.setItem('app_state_v23', JSON.stringify(state));
    }

    function switchTab(tabName) {
        state.currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('content-' + tabName).classList.add('active');
        renderAll();
    }

    // Умный фокус для статического поля начала суток
    function handleStaticTimeInput(el) {
        el.value = el.value.replace(/[^0-9]/g, '');
        if (el.value.length >= 2) {
            validateStaticTime(el, el.id === 'dayStartH' ? 23 : 59);
            if (el.id === 'dayStartH') {
                const minInput = document.getElementById('dayStartM');
                minInput.focus();
                minInput.select();
            }
        }
    }

    function validateStaticTime(el, max) {
        let val = parseInt(el.value, 10);
        if(isNaN(val) || val < 0) val = 0;
        if(val > max) val = max;
        el.value = String(val).padStart(2, '0');
        saveState();
    }

    // РЕАКТИВНЫЙ РАБОЧИЙ ВВОД В ТАБЛИЦАХ (Без перерисовки HTML!)
    function syncLiveField(el, type, id, field, max) {
        el.value = el.value.replace(/[^0-9]/g, '');
        let valStr = el.value;
        
        // Запись напрямую в стейт
        const list = (type === 'downtime') ? state.downtimes : state.readiness;
        let found = list.find(item => item.id === id);
        if(found) {
            found[field] = valStr;
            saveState();
        }

        // Автоматический прыжок на следующее окно, если забили 2 цифры
        if (valStr.length >= 2) {
            let num = parseInt(valStr, 10);
            if (num > max) el.value = String(max).padStart(2, '0');
            if (found) found[field] = el.value;
            saveState();

            // Ищем соседний input внутри этой же карточки sub-card
            const card = el.closest('.sub-card');
            const inputs = Array.from(card.querySelectorAll('.time-input'));
            const index = inputs.indexOf(el);
            if (index > -1 && index < inputs.length - 1) {
                const nextInput = inputs[index + 1];
                nextInput.focus();
                nextInput.select();
            }
        }
    }

    // Дополнительная очистка пустых окон при потере фокуса
    function blurLiveField(el, type, id, field, max) {
        let val = parseInt(el.value, 10);
        if (isNaN(val)) val = 0;
        if (val > max) val = max;
        el.value = String(val).padStart(2, '0');
        
        const list = (type === 'downtime') ? state.downtimes : state.readiness;
        let found = list.find(item => item.id === id);
        if(found) {
            found[field] = el.value;
            saveState();
        }
    }

    function resetDay() {
        if(confirm('Очистить график смен, простои и готовность?')) {
            state.shifts.forEach(s => s.variantId = null);
            state.downtimes = []; state.readiness = [];
            document.getElementById('resultsCard').classList.remove('active');
            renderAll(); saveState();
        }
    }

    function renderAll() {
        if(state.currentTab === 'calc') {
            const container = document.getElementById('shifts-container');
            container.innerHTML = '';
            state.shifts.forEach((shift, idx) => {
                let options = `<option value="none">— Не работал / Простой —</option>`;
                state.variants.forEach(v => {
                    options += `<option value="${v.id}" ${shift.variantId == v.id ? 'selected' : ''}>${v.name}</option>`;
                });
                container.innerHTML += `
                    <div class="sub-card">
                        <div style="font-weight:700; color:#0f172a;"><span style="font-size:10px; color:#64748b; display:block; font-weight:800;">ЧАСТЬ ${idx+1}</span>${shift.start} — ${shift.end}</div>
                        <select class="select-w-60" onchange="state.shifts[${idx}].variantId = this.value === 'none' ? null : parseInt(this.value,10); saveState();">
                            ${options}
                        </select>
                    </div>`;
            });

            renderDynamicRows('downtime', state.downtimes);
            renderDynamicRows('readiness', state.readiness);
        }

        if(state.currentTab === 'variants') {
            const container = document.getElementById('variants-container');
            container.innerHTML = '';
            state.variants.forEach((v, vIdx) => {
                let eqChecks = '';
                state.equipment.forEach(eq => {
                    const isChecked = v.eqIds.includes(eq.id) ? 'checked' : '';
                    eqChecks += `
                        <label style="display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; font-weight:600; font-size:15px; color:#334155;">
                            <input type="checkbox" style="width:20px; height:20px; accent-color:#1e3a8a;" ${isChecked} onchange="toggleEqInVariant(${vIdx}, ${eq.id}, this.checked)">
                            <span>${eq.name}</span>
                        </label>`;
                });
                container.innerHTML += `
                    <div class="card">
                        <input type="text" value="${v.name}" style="font-weight:700; font-size:16px; border:none; border-bottom:2px solid #e2e8f0; background:transparent; color: #1e3a8a; border-radius:0; padding:6px 0;" oninput="state.variants[${vIdx}].name = this.value; saveState();">
                        <div class="sub-card" style="flex-direction:column; align-items:flex-start; gap:6px; background:#f8fafc;">
                            <div style="font-size:11px; color:#64748b; font-weight:800;">СОСТАВ АГРЕГАТОВ:</div>
                            ${eqChecks}
                        </div>
                    </div>`;
            });
        }

        if(state.currentTab === 'equipment') {
            const container = document.getElementById('equipment-list');
            container.innerHTML = '';
            state.equipment.forEach((eq, idx) => {
                container.innerHTML += `
                    <div style="display:flex; justify-content:between; align-items:center; padding:12px; border-bottom:1px solid #e2e8f0; width:100%;">
                        <span style="font-size:16px; font-weight:600; flex-grow:1; color:#0f172a;">${eq.name}</span>
                        <button class="del-btn" style="margin-top:0; height:34px; width:34px;" onclick="removeEquipment(${eq.id})">✕</button>
                    </div>`;
            });
        }
    }

    function renderDynamicRows(type, list) {
        const container = document.getElementById(type + '-container');
        container.innerHTML = '';
        list.forEach((item) => {
            let eqOptions = `<option value="none" disabled selected hidden>Выберите технику</option>`;
            state.equipment.forEach(eq => {
                eqOptions += `<option value="${eq.id}" ${item.eqId == eq.id ? 'selected' : ''}>${eq.name}</option>`;
            });

            container.innerHTML += `
                <div class="sub-card" style="padding:8px 6px; gap:4px; align-items: center;">
                    <select style="width:33%; padding: 8px 4px; font-size:13px; font-weight:700;" onchange="const list=( '${type}'==='downtime')?state.downtimes:state.readiness; let f=list.find(i=>i.id==='${item.id}'); if(f){f.eqId=parseInt(this.value,10); saveState();}">
                        ${eqOptions}
                    </select>
                    
                    <div class="time-container-inputs">
                        <div class="time-box">
                            <span>Нач</span>
                            <input type="text" inputmode="decimal" pattern="[0-9]*" class="time-input" value="${item.sh}" oninput="syncLiveField(this, '${type}', '${item.id}', 'sh', 23)" onblur="blurLiveField(this, '${type}', '${item.id}', 'sh', 23)" onclick="this.select()">
                        </div>
                        <div class="time-divider">:</div>
                        <div class="time-box">
                            <span>Мин</span>
                            <input type="text" inputmode="decimal" pattern="[0-9]*" class="time-input" value="${item.sm}" oninput="syncLiveField(this, '${type}', '${item.id}', 'sm', 59)" onblur="blurLiveField(this, '${type}', '${item.id}', 'sm', 59)" onclick="this.select()">
                        </div>
                    </div>
                    
                    <span style="color:#cbd5e1; font-weight:bold; margin-top:12px; padding:0 1px;">—</span>
                    
                    <div class="time-container-inputs">
                        <div class="time-box">
                            <span>Кон</span>
                            <input type="text" inputmode="decimal" pattern="[0-9]*" class="time-input" value="${item.eh}" oninput="syncLiveField(this, '${type}', '${item.id}', 'eh', 23)" onblur="blurLiveField(this, '${type}', '${item.id}', 'eh', 23)" onclick="this.select()">
                        </div>
                        <div class="time-divider">:</div>
                        <div class="time-box">
                            <span>Мин</span>
                            <input type="text" inputmode="decimal" pattern="[0-9]*" class="time-input" value="${item.em}" oninput="syncLiveField(this, '${type}', '${item.id}', 'em', 59)" onblur="blurLiveField(this, '${type}', '${item.id}', 'em', 59)" onclick="this.select()">
                        </div>
                    </div>
                    
                    <button class="del-btn" onclick="deleteDynamicRow('${type}', '${item.id}')">✕</button>
                </div>`;
        });
        if(list.length === 0) {
            container.innerHTML = `<div style="text-align:center; font-size:12px; color:#64748b; font-style:italic; padding:8px;">Нет записей</div>`;
        }
    }

    function addDynamicRow(type) {
        const targetList = (type === 'downtime') ? state.downtimes : state.readiness;
        targetList.push({ id: String(Date.now() + Math.random()), eqId: null, sh:'', sm:'', eh:'', em:'' });
        renderAll();
        saveState();
    }

    function deleteDynamicRow(type, id) {
        if (type === 'downtime') {
            state.downtimes = state.downtimes.filter(item => item.id !== id);
        } else {
            state.readiness = state.readiness.filter(item => item.id !== id);
        }
        renderAll();
        saveState();
    }
    
    function toggleEqInVariant(vIdx, eqId, isChecked) {
        let ids = state.variants[vIdx].eqIds;
        if(isChecked) { if(!ids.includes(eqId)) ids.push(eqId); } 
        else { state.variants[vIdx].eqIds = ids.filter(id => id !== eqId); }
        saveState();
    }

    function addNewEquipment() {
        const inp = document.getElementById('newEqName');
        if(!inp.value.trim()) return;
        state.equipment.push({ id: Date.now(), name: inp.value.trim() });
        inp.value = ''; renderAll(); saveState();
    }

    function removeEquipment(id) {
        state.equipment = state.equipment.filter(e => e.id !== id);
        state.variants.forEach(v => v.eqIds = v.eqIds.filter(item => item !== id));
        state.downtimes = state.downtimes.filter(d => d.eqId !== id);
        state.readiness = state.readiness.filter(r => r.eqId !== id);
        renderAll(); saveState();
    }

    function safeTimeStr(val) {
        if (!val || val.trim() === '') return '00';
        return val.trim();
    }

    function parseToMinutesRel(hStr, mStr, baseH, baseM) {
        let h = parseInt(safeTimeStr(hStr), 10);
        let m = parseInt(safeTimeStr(mStr), 10);
        if(isNaN(h) || isNaN(m)) return -1;
        
        let totalMins = h * 60 + m;
        let baseMins = baseH * 60 + baseM;
        
        let diff = totalMins - baseMins;
        if(diff < 0) diff += 1440;
        return diff;
    }

    function calculateDay() {
        const report = [];
        const DAY_MINS = 1440;
        
        let dayStartHField = document.getElementById('dayStartH');
        let dayStartMField = document.getElementById('dayStartM');
        if(!dayStartHField.value) dayStartHField.value = '00';
        if(!dayStartMField.value) dayStartMField.value = '00';

        const baseH = parseInt(dayStartHField.value, 10) || 0;
        const baseM = parseInt(dayStartMField.value, 10) || 0;

        state.equipment.forEach(eq => {
            const schArr = new Array(DAY_MINS).fill(false);
            const downArr = new Array(DAY_MINS).fill(false);
            const readArr = new Array(DAY_MINS).fill(false);

            state.downtimes.forEach(d => {
                if(d.eqId !== eq.id) return;
                let start = parseToMinutesRel(d.sh, d.sm, baseH, baseM);
                let end = parseToMinutesRel(d.eh, d.em, baseH, baseM);
                if(start === -1 || end === -1) return;
                
                if(start === end) {
                    for(let m=0; m<DAY_MINS; m++) downArr[m] = true;
                } else if(end < start) {
                    for(let m=start; m<DAY_MINS; m++) downArr[m] = true;
                    for(let m=0; m<end; m++) downArr[m] = true;
                } else {
                    for(let m=start; m<end; m++) downArr[m] = true;
                }
            });

            state.shifts.forEach(shift => {
                if(!shift.variantId) return;
                let v = state.variants.find(varItem => varItem.id === shift.variantId);
                if(v && v.eqIds.includes(eq.id)) {
                    let [sh, sm] = shift.start.split(':');
                    let [eh, em] = shift.end.split(':');
                    let start = parseToMinutesRel(sh, sm, baseH, baseM);
                    let end = parseToMinutesRel(eh, em, baseH, baseM);
                    
                    if(start !== -1 && end !== -1) {
                        if(end <= start) end += 1440;
                        for(let m = start; m < end; m++) {
                            let currM = m % 1440;
                            if(!downArr[currM]) schArr[currM] = true;
                        }
                    }
                }
            });

            state.readiness.forEach(r => {
                if(r.eqId !== eq.id) return;
                let start = parseToMinutesRel(r.sh, r.sm, baseH, baseM);
                let end = parseToMinutesRel(r.eh, r.em, baseH, baseM);
                if(start === -1 || end === -1) return;

                if(start === end) {
                    for(let m=0; m<DAY_MINS; m++) {
                        if(!schArr[m] && !downArr[m]) readArr[m] = true;
                    }
                } else if(end < start) {
                    for(let m=start; m<DAY_MINS; m++) { if(!schArr[m] && !downArr[m]) readArr[m] = true; }
                    for(let m=0; m<end; m++) { if(!schArr[m] && !downArr[m]) readArr[m] = true; }
                } else {
                    for(let m=start; m<end; m++) { if(!schArr[m] && !downArr[m]) readArr[m] = true; }
                }
            });

            let schMins = schArr.filter(Boolean).length;
            let dwnMins = downArr.filter(Boolean).length;
            let readMins = readArr.filter(Boolean).length;

            report.push({ name: eq.name, sch: schMins, dwn: dwnMins, read: readMins });
        });

        const resList = document.getElementById('results-list');
        resList.innerHTML = '';
        report.forEach(r => {
            resList.innerHTML += `
                <div class="res-item">
                    <div class="res-header">
                        <span>${r.name}</span>
                        ${r.dwn > 0 ? `<span style="color:#b91c1c; font-size:12px;">Простой: ${Math.floor(r.dwn/60)}ч ${r.dwn%60}м</span>` : ''}
                    </div>
                    <div class="res-grid">
                        <div class="res-sub">По графику: <span class="res-val">${Math.floor(r.sch/60)} ч. ${r.sch%60} мин.</span></div>
                        <div class="res-sub">В готовности: <span class="res-val res-val-green">${Math.floor(r.read/60)} ч. ${r.read%60} мин.</span></div>
                    </div>
                </div>`;
        });
        document.getElementById('resultsCard').classList.add('active');
    }
</script>
</body>
</html>
